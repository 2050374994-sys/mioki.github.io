<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1100">
<title>MIOKI ADMIN</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-width:900px;color:#673047;font:13px "Courier New","Microsoft YaHei",monospace;background:#e8b5c8;background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(rgba(255,255,255,.6) 1px,transparent 1px);background-size:28px 28px,47px 47px}
.shell{width:800px;margin:30px auto;background:#fff8ee;border:5px double #8c4562;box-shadow:8px 8px 0 rgba(80,35,55,.3);padding:20px}
h1{font:36px Georgia,serif;color:#c74d78;text-align:center;margin:0 0 10px;text-shadow:3px 3px 0 #f2b1c7;letter-spacing:3px}
.subtitle{text-align:center;color:#a88;font-size:11px;margin-bottom:20px;letter-spacing:2px}
h2{font:16px Georgia,serif;color:#a44268;border-bottom:2px dashed #d17697;padding-bottom:5px;margin-top:25px}
h2:before{content:"✦ "}
h2:after{content:" ✦"}
.section{background:#fffdf8;border:3px double #d17697;padding:15px;margin-top:10px;box-shadow:3px 3px 0 rgba(140,69,98,.1)}
label{display:block;margin-top:10px;font-weight:bold;color:#b83f6d;letter-spacing:1px}
label:before{content:"♡ "}
input,textarea,select{width:100%;padding:8px;margin-top:5px;border:3px inset #d17697;background:#fffdf8;font:13px "Courier New","Microsoft YaHei",monospace;color:#673047;outline:none}
input:focus,textarea:focus,select:focus{border-color:#c74d78;background:#fff6fa}
textarea{height:80px;resize:vertical}
button{padding:8px 20px;margin-top:10px;background:#f9dbe6;color:#673047;border:3px outset #d17697;cursor:pointer;font:13px "Courier New","Microsoft YaHei",monospace;font-weight:bold;box-shadow:2px 2px 0 rgba(90,35,55,.3)}
button:active{border:3px inset #d17697;box-shadow:none;transform:translateY(1px)}
button:hover{background:#f2b1c7}
.back{text-align:center;margin-top:25px;padding-top:15px;border-top:2px dashed #d17697}
.back a{color:#b83f6d;text-decoration:none;font-size:14px;font-weight:bold}
.back a:hover{text-decoration:underline}
.success{color:#5c8b68;font-size:12px;margin-top:5px;font-weight:bold}
.tip{background:#fff6fa;border:1px dashed #d17697;padding:8px;margin-top:10px;color:#a88;font-size:11px}
#editStatus option[value="● online"]{color:#5c8b68;font-weight:bold}
#editStatus option[value="● offline"]{color:#c74d78;font-weight:bold}
.song-item{padding:5px 0;border-bottom:1px dotted #d17697}
.song-item b{color:#c74d78}
.footer-note{text-align:center;margin-top:20px;color:#d4a0b8;font-size:10px;letter-spacing:3px}
</style>
</head>
<body>
<div class="shell">
<h1>MIOKI ADMIN</h1>
<div class="subtitle">── ✦ PRIVATE CONTROL PANEL ✦ ──</div>

<h2>个人资料</h2>
<div class="section">
  <label>名字</label>
  <input id="editName" placeholder="Mioki">
  <label>签名</label>
  <textarea id="editBio" placeholder="喜欢粉色、音乐、一些漂亮的小东西。"></textarea>
  <label>心情 Mood</label>
  <select id="editMood">
    <option value="dreamy">dreamy 梦幻</option>
    <option value="happy">happy 开心</option>
    <option value="tired">tired 累了</option>
    <option value="sleepy">sleepy 困困</option>
    <option value="excited">excited 兴奋</option>
    <option value="calm">calm 平静</option>
    <option value="sad">sad 难过</option>
    <option value="lazy">lazy 懒懒</option>
  </select>
  <button onclick="saveProfile()">保存资料</button>
  <span class="success" id="profileMsg"></span>
</div>

<h2>在线状态</h2>
<div class="section">
  <label>选择状态</label>
  <select id="editStatus">
    <option value="● online">● 在线</option>
    <option value="● offline">● 离线</option>
  </select>
  <button onclick="saveStatus()">保存状态</button>
  <span class="success" id="statusMsg"></span>
</div>

<h2>欢迎语</h2>
<div class="section">
  <label>欢迎标题</label>
  <input id="editWelcomeTitle" placeholder="你好，欢迎来到这里">
  <label>欢迎内容</label>
  <textarea id="editWelcomeText" placeholder="这里不是一个普通的网站…"></textarea>
  <button onclick="saveWelcome()">保存欢迎语</button>
  <span class="success" id="welcomeMsg"></span>
</div>

<h2>音乐管理</h2>
<div class="section">
  <label>歌曲名</label>
  <input id="editSongTitle" placeholder="歌曲名">
  <label>歌手</label>
  <input id="editSongArtist" placeholder="歌手">
  <label>歌曲链接</label>
  <input id="editSongSrc" placeholder="https://...mp3">
  <button onclick="addSong()">添加歌曲</button>
  <button onclick="clearSongs()" style="background:#fff;color:#c74d78;">清空歌单</button>
  <span class="success" id="songMsg"></span>
  <div id="songList" style="margin-top:10px;"></div>
</div>

<h2>碎碎念管理</h2>
<div class="section">
  <label>新碎碎念</label>
  <input id="editThought" placeholder="写下今天想说的…">
  <button onclick="addThought()">发布碎碎念</button>
  <span class="success" id="thoughtMsg"></span>
  <div id="thoughtList" style="margin-top:15px;"></div>
</div>

<h2>时间线管理</h2>
<div class="section">
  <label>日期</label>
  <input id="timelineDate" type="date">
  <label>内容</label>
  <input id="timelineText" placeholder="比如：网站正式建立">
  <button onclick="addTimeline()">添加时间线</button>
  <button onclick="clearTimeline()" style="background:#fff;color:#c74d78;">清空时间线</button>
  <span class="success" id="timelineMsg"></span>
  <div id="timelineList" style="margin-top:15px;"></div>
</div>

<h2>写日记</h2>
<div class="section">
  <label>日期</label>
  <input id="diaryDate" type="date">
  <label>标题</label>
  <input id="diaryTitle" placeholder="日记标题">
  <label>心情</label>
  <select id="diaryMood">
    <option value="★★★★★">★★★★★ 超开心</option>
    <option value="★★★★☆">★★★★☆ 不错</option>
    <option value="★★★☆☆">★★★☆☆ 一般般</option>
    <option value="★★☆☆☆">★★☆☆☆ 不太好</option>
    <option value="★☆☆☆☆">★☆☆☆☆ 难过</option>
  </select>
  <label>内容</label>
  <textarea id="diaryContent" rows="6" placeholder="写点什么…"></textarea>
  <button onclick="saveDiary()">发布日记</button>
  <span class="success" id="diaryMsg"></span>
  <div id="diaryAdminList" style="margin-top:15px;"></div>
</div>

<h2>相册管理</h2>
<div class="section">
  <label>图片链接</label>
  <input id="editPhoto" placeholder="https://...jpg">
  <label>图片说明</label>
  <input id="editPhotoLabel" placeholder="照片一">
  <button onclick="addPhoto()">添加照片</button>
  <button onclick="clearPhotos()" style="background:#fff;color:#c74d78;">清空相册</button>
  <span class="success" id="photoMsg"></span>
  <div class="tip">提示：先上传图片到 GitHub 仓库的 images 文件夹<br>链接格式：https://2050374994-sys.github.io/mioki.github.io/images/文件名.jpg</div>
</div>

<div class="back">
  <a href="index.html">← 返回网站</a>
</div>
<div class="footer-note">MADE WITH LOVE BY MIOKI</div>
</div>

<script>
function $(id){return document.getElementById(id)}

function saveData(key, value){
  localStorage.setItem('mioki_' + key, JSON.stringify(value));
}
function loadData(key){
  var data = localStorage.getItem('mioki_' + key);
  return data ? JSON.parse(data) : null;
}

function saveProfile(){
  saveData('profile', {
    name: $('editName').value || 'Mioki',
    bio: $('editBio').value || '喜欢粉色、音乐、一些漂亮的小东西。',
    mood: $('editMood').value || 'dreamy'
  });
  $('profileMsg').textContent = '✓ 已保存';
}

function saveStatus(){
  saveData('status', $('editStatus').value);
  $('statusMsg').textContent = '✓ 已保存';
}

function saveWelcome(){
  saveData('welcome', {
    title: $('editWelcomeTitle').value,
    text: $('editWelcomeText').value
  });
  $('welcomeMsg').textContent = '✓ 已保存';
}

function addSong(){
  var songs = loadData('songs') || [];
  songs.push({
    title: $('editSongTitle').value || '未命名',
    artist: $('editSongArtist').value || '未知',
    src: $('editSongSrc').value
  });
  saveData('songs', songs);
  $('songMsg').textContent = '✓ 已添加';
  renderSongs();
  $('editSongTitle').value='';$('editSongArtist').value='';$('editSongSrc').value='';
}
function clearSongs(){
  saveData('songs', []);
  renderSongs();
  $('songMsg').textContent = '✓ 已清空';
}
function renderSongs(){
  var songs = loadData('songs') || [];
  var html = '';
  songs.forEach(function(s){
    html += '<div class="song-item"><b>♫ ' + s.title + '</b> - ' + s.artist + '</div>';
  });
  $('songList').innerHTML = html || '<span style="color:#a88;">暂无歌曲</span>';
}

function addThought(){
  var thoughts = loadData('thoughts') || [];
  var now = new Date();
  var date = String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  thoughts.unshift({date: date, text: $('editThought').value});
  saveData('thoughts', thoughts);
  $('thoughtMsg').textContent = '✓ 已发布';
  $('editThought').value='';
  renderThoughtAdmin();
}
function renderThoughtAdmin(){
  var thoughts = loadData('thoughts') || [];
  var html = '';
  thoughts.forEach(function(t, i){
    html += '<div class="song-item"><b>' + t.date + '</b> ' + t.text + ' <span style="float:right;color:#c74d78;cursor:pointer;" onclick="deleteThought(' + i + ')">✕</span></div>';
  });
  $('thoughtList').innerHTML = html || '<span style="color:#a88;">暂无碎碎念</span>';
}
function deleteThought(index){
  var thoughts = loadData('thoughts') || [];
  thoughts.splice(index, 1);
  saveData('thoughts', thoughts);
  renderThoughtAdmin();
}

function addTimeline(){
  var timelines = loadData('timelines') || [];
  var date = $('timelineDate').value || new Date().toISOString().slice(0,10);
  var displayDate = date.replace(/-/g, '.');
  timelines.unshift({date: displayDate, text: $('timelineText').value || '...'});
  saveData('timelines', timelines);
  $('timelineMsg').textContent = '✓ 已添加';
  $('timelineDate').value='';$('timelineText').value='';
  renderTimelineAdmin();
}
function renderTimelineAdmin(){
  var timelines = loadData('timelines') || [];
  var html = '';
  timelines.forEach(function(t, i){
    html += '<div class="song-item"><b>' + t.date + '</b> ' + t.text + ' <span style="float:right;color:#c74d78;cursor:pointer;" onclick="deleteTimeline(' + i + ')">✕</span></div>';
  });
  $('timelineList').innerHTML = html || '<span style="color:#a88;">暂无时间线</span>';
}
function deleteTimeline(index){
  var timelines = loadData('timelines') || [];
  timelines.splice(index, 1);
  saveData('timelines', timelines);
  renderTimelineAdmin();
}
function clearTimeline(){
  saveData('timelines', []);
  renderTimelineAdmin();
  $('timelineMsg').textContent = '✓ 已清空';
}

function saveDiary(){
  var diaries = loadData('diaries') || [];
  var date = $('diaryDate').value || new Date().toISOString().slice(0,10);
  var displayDate = date.replace(/-/g, '.');
  diaries.unshift({
    date: displayDate,
    mood: $('diaryMood').value,
    title: $('diaryTitle').value || '无题',
    content: $('diaryContent').value
  });
  saveData('diaries', diaries);
  $('diaryMsg').textContent = '✓ 日记已发布';
  $('diaryDate').value='';$('diaryTitle').value='';$('diaryContent').value='';
  renderDiaryAdmin();
}
function renderDiaryAdmin(){
  var diaries = loadData('diaries') || [];
  var html = '';
  diaries.forEach(function(d, i){
    html += '<div class="song-item"><b>' + d.date + '</b> ' + d.title + ' <span style="float:right;color:#c74d78;cursor:pointer;" onclick="deleteDiary(' + i + ')">✕</span></div>';
  });
  $('diaryAdminList').innerHTML = html || '<span style="color:#a88;">暂无日记</span>';
}
function deleteDiary(index){
  var diaries = loadData('diaries') || [];
  diaries.splice(index, 1);
  saveData('diaries', diaries);
  renderDiaryAdmin();
}

function addPhoto(){
  var photos = loadData('photos') || [];
  photos.push({src: $('editPhoto').value, label: $('editPhotoLabel').value || '照片'});
  saveData('photos', photos);
  $('photoMsg').textContent = '✓ 已添加';
  $('editPhoto').value='';$('editPhotoLabel').value='';
}
function clearPhotos(){
  saveData('photos', []);
  $('photoMsg').textContent = '✓ 已清空';
}

function loadAll(){
  var profile = loadData('profile');
  if(profile){
    $('editName').value = profile.name;
    $('editBio').value = profile.bio;
    $('editMood').value = profile.mood;
  }
  var status = loadData('status');
  if(status) $('editStatus').value = status;
  var welcome = loadData('welcome');
  if(welcome){
    $('editWelcomeTitle').value = welcome.title;
    $('editWelcomeText').value = welcome.text;
  }
  renderSongs();
  renderThoughtAdmin();
  renderTimelineAdmin();
  renderDiaryAdmin();
}

loadAll();
</script>
</body>
</html>
